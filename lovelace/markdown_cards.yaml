# Punten- en bergklassement (top 5, met gepakte punten)
- type: markdown
  card_mod:
    style: |
      ha-card { background: none; border: none; box-shadow: none; }
  content: >
    {%- set e = 'sensor.volgende_worldtour_wedstrijd' -%}

    {%- macro mv(m) -%}
    {%- if m and m > 0 %} <font color='#7FB069'>&#9650;{{ m }}</font>{% elif m and m < 0 %}
    <font color='#E4572E'>&#9660;{{ -m }}</font>{% endif -%}
    {%- endmacro -%}

    {%- macro blok(titel, rows) -%}
    {%- if rows %}**{{ titel }}**

    {% for x in rows %}
    {{ x.rank }}. {{ x.rider }} - {{ x.points }}{{ mv(x.get('move')) }}{% if
    x.get('gain') %} <font color='#7FB069'>+{{ x.gain }}</font>{% endif %}
    {%- endfor %}

    {% endif -%}
    {%- endmacro -%}

    {{ blok('Puntenklassement', state_attr(e,'points_top') or []) }}
    {{ blok('Bergklassement', state_attr(e,'kom_top') or []) }}

# Tv-zenders met logo en uitzendtijd (rechtsboven in de pop-up)
- type: markdown
  card_mod:
    style: |
      ha-card { background: none; border: none; box-shadow: none; padding: 2px 8px 0; }
      ha-card .card-content { text-align: right; padding: 0; font-size: 13px; }
      ha-markdown img { height: 20px; width: auto; border-radius: 3px;
                        vertical-align: middle; margin-right: 5px; }
  content: >
    {%- set ch = state_attr('sensor.volgende_worldtour_wedstrijd','channels_detail') or [] -%}

    {%- for c in ch %}{% if not loop.first %} &nbsp;&middot;&nbsp; {% endif %}{% if c.logo %}<img
    src="{{ c.logo }}" alt="{{ c.name }}" height="20"
    style="vertical-align:middle;border-radius:3px;margin-right:5px">{% else %}{{ c.name
    }} {% endif %}{{ c.time }}{% endfor %}
