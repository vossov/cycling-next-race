# Markdown-kaarten voor de pop-up
#
# Plak deze los in je Bubble Card-popup. Elke kaart verbergt zichzelf
# als het bijbehorende attribuut leeg is.

# Dag-uitslag van de laatst verreden etappe (top 10)
- type: markdown
  card_mod:
    style: |
      ha-card { background: none; border: none; box-shadow: none; }
  content: >
    {%- set e = 'sensor.volgende_worldtour_wedstrijd' -%}
    {%- set rs = state_attr(e,'last_result') or [] -%}

    {%- macro secs(t) -%}
    {%- set p = t.split(':')|map('int')|list -%}
    {{ (p[0]*3600 + p[1]*60 + p[2]) if p|length == 3 else (p[0]*60 + p[1]) }}
    {%- endmacro -%}

    {%- macro gap(t, w) -%}
    {%- set g = (secs(t)|int) - (secs(w)|int) -%}
    {%- if g <= 0 -%}z.t.{%- elif g < 3600 -%}+{{ '%d:%02d'|format(g//60, g%60) }}{%-
    else -%}+{{ '%d:%02d:%02d'|format(g//3600, (g%3600)//60, g%60) }}{%- endif -%}
    {%- endmacro -%}

    {%- if rs %}**{{ state_attr(e,'last_stage_label') or 'Uitslag' }}**

    {% for x in rs %}
    {{ x.rank }}. {{ x.rider }} - {% if loop.first or ':' not in x.time or ':' not in
    rs[0].time %}{{ x.time }}{% else %}{{ gap(x.time, rs[0].time) }}{% endif %}
    {%- endfor %}
    {%- endif %}

# Algemeen klassement (top 10), met positieverandering en dagwinst
- type: markdown
  card_mod:
    style: |
      ha-card { background: none; border: none; box-shadow: none; }
  content: >
    {%- set e = 'sensor.volgende_worldtour_wedstrijd' -%}
    {%- set gc = state_attr(e,'gc_top') or [] -%}

    {%- macro secs(t) -%}
    {%- set p = t.split(':')|map('int')|list -%}
    {{ (p[0]*3600 + p[1]*60 + p[2]) if p|length == 3 else (p[0]*60 + p[1]) }}
    {%- endmacro -%}

    {%- macro gap(t, w) -%}
    {%- set g = (secs(t)|int) - (secs(w)|int) -%}
    {%- if g <= 0 -%}z.t.{%- elif g < 3600 -%}+{{ '%d:%02d'|format(g//60, g%60) }}{%-
    else -%}+{{ '%d:%02d:%02d'|format(g//3600, (g%3600)//60, g%60) }}{%- endif -%}
    {%- endmacro -%}

    {%- macro mv(m) -%}
    {%- if m and m > 0 %} <font color='#7FB069'>&#9650;{{ m }}</font>{% elif m and m < 0 %}
    <font color='#E4572E'>&#9660;{{ -m }}</font>{% endif -%}
    {%- endmacro -%}

    {%- macro chg(s) -%}
    {%- if s %} <font color='{{ '#E4572E' if s > 0 else '#7FB069' }}'>{{ '+' if s > 0
    else '-' }}{{ '%d:%02d'|format((s|abs)//60, (s|abs)%60) }}</font>{% endif -%}
    {%- endmacro -%}

    {%- if gc %}**{{ 'Algemeen klassement' }}**

    {% for x in gc %}
    {{ x.rank }}. {{ x.rider }} - {% if loop.first or ':' not in x.time or ':' not in
    gc[0].time %}{{ x.time }}{% else %}{{ gap(x.time, gc[0].time) }}{% endif %}{{ mv(x.get('move')) }}{{ chg(x.get('gain_s')) }}
    {%- endfor %}
    {%- endif %}

