name: Validatie

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pytest installeren
        run: python -m pip install --upgrade pip pytest voluptuous pyyaml
      - name: Syntaxcontrole
        run: python -m compileall -q custom_components/cycling_next_race
      - name: Syntaxcontrole van de kaart
        run: node --check custom_components/cycling_next_race/www/cycling-next-race-card.js
      - name: Kaart moet op oude WebViews parsen
        # de kaart wordt op élke frontend-pagina geladen; te nieuwe syntax
        # legt daarmee het hele dashboard van zo'n apparaat plat
        run: |
          npm install --no-save --no-audit --no-fund acorn
          node tests/browser/syntax_test.mjs
      - name: Tests draaien
        run: python -m pytest tests/ -q
