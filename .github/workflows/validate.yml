name: Validatie

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  versie:
    # Zonder ophoging meldt Home Assistant na een update nog de oude versie
    # en weet je bij een probleem niet wat er draait. Alleen op een pull
    # request: daar is bekend waartegen we vergelijken.
    name: Versie opgehoogd
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wie de integratie wijzigt hoogt het versienummer op
        env:
          BASIS: ${{ github.base_ref }}
        run: |
          git fetch --quiet origin "$BASIS"
          if git diff --quiet "origin/$BASIS...HEAD" -- custom_components/; then
            echo "niets aan de integratie gewijzigd; het versienummer mag blijven staan"
            exit 0
          fi
          lees() { python3 -c "import json,sys; print(json.load(sys.stdin)['version'])"; }
          pad=custom_components/cycling_next_race/manifest.json
          nu=$(lees < "$pad")
          was=$(git show "origin/$BASIS:$pad" | lees)
          echo "was: $was, nu: $nu"
          if [ "$was" = "$nu" ]; then
            echo "::error::de integratie is gewijzigd maar manifest.json staat nog op $was — hoog version in manifest.json én VERSION in const.py op (tests/test_kaart.py bewaakt dat die twee gelijk blijven)"
            exit 1
          fi

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pytest installeren
        run: python -m pip install --upgrade pip pytest voluptuous pyyaml
      - name: Syntaxcontrole
        run: python -m compileall -q custom_components/cycling_next_race
      - name: Syntaxcontrole van de kaart
        run: node --check custom_components/cycling_next_race/www/cycling-next-race-card.js
      - name: Kaart moet op oude WebViews parsen
        # de kaart wordt op élke frontend-pagina geladen; te nieuwe syntax
        # legt daarmee het hele dashboard van zo'n apparaat plat
        run: |
          npm install --no-save --no-audit --no-fund acorn
          node tests/browser/syntax_test.mjs
      - name: Tests draaien
        run: python -m pytest tests/ -q
